version: "3"

tasks:
  i:
    desc: "Install Conan dependencies and configure build system"
    cmds:
      - task install

  install:
    desc: "Install Conan dependencies and configure build system"
    cmds:
      - conan install . --output-folder=build --build=missing -s compiler.cppstd=17

  b:
    desc: "Build r-type client and server with conan-release preset"
    cmds:
      - task build

  cb:
    desc: "Build rtype client with conan-release preset"
    cmds:
      - cmake --preset conan-release -DBUILD_RTYPE=ON -DBUILD_TESTS=OFF -DBUILD_TOOLS=OFF -DGRAPHIC=ON -DPHYSICS=ON -DINPUTS=ON -DAUDIO=ON -DSERVER=OFF -DCLIENT=ON
      - cmake --build build --preset conan-release
      - mkdir -p ./Release
      - cp ./build/build/Release/Games/RType/r-type_client ./Release/r-type_client

  sb:
    desc: "Build rtype server with conan-release preset"
    cmds:
      - cmake --preset conan-release -DBUILD_RTYPE=ON -DBUILD_TESTS=OFF -DBUILD_TOOLS=OFF -DGRAPHIC=ON -DPHYSICS=ON -DINPUTS=ON -DAUDIO=ON -DSERVER=ON -DCLIENT=OFF
      - cmake --build build --preset conan-release
      - mkdir -p ./Release
      - cp ./build/build/Release/Games/RType/r-type_server ./Release/r-type_server

  build:
    desc: "Build r-type client and server conan-release preset"
    cmds:
      - task cb
      - task sb

  bw:
    desc: "Build the project with conan-debug preset"
    cmds:
      - task buildw

  buildw:
    desc: "Build the r-type client and server with conan-default preset for windows"
    cmds:
      - cmake --preset conan-default -DBUILD_RTYPE=ON -DBUILD_TESTS=OFF -DGRAPHIC=ON -DPHYSICS=ON -DINPUTS=ON -DAUDIO=ON -DSERVER=ON -DCLIENT=OFF
      - cmake --preset conan-default -DBUILD_RTYPE=ON -DBUILD_TESTS=OFF -DGRAPHIC=ON -DPHYSICS=ON -DINPUTS=ON -DAUDIO=ON -DSERVER=OFF -DCLIENT=ON
      - cmake --build build --preset conan-release

  crtype:
    desc: "Run the r-type client target"
    cmds:
      - ./build/build/Release/Games/RType/r-type_client

  srtype:
    desc: "Run the r-type server target"
    cmds:
      - ./build/build/Release/Games/RType/r-type_server

  cdebugMac:
    desc: "Run the RType client target in debug mode on Mac"
    cmds:
      - lldb ./build/build/Release/Games/RType/r-type_client

  sdebugMac:
    desc: "Run the RType server target in debug mode on Mac"
    cmds:
      - lldb ./build/build/Release/Games/RType/r-type_server

  test:
    desc: "Run the test target with coverage and generate HTML report"
    cmds:
      - cmake --preset conan-release -DBUILD_RTYPE=ON -DBUILD_TESTS=ON -DCOVERAGE=ON
      - cmake --build build --preset conan-release
      - ./build/build/Release/Engine/Test/Test
      - lcov --capture --directory ./build --output-file coverage.info
      - lcov --remove coverage.info '/usr/*' '*/build/_deps/*' --output-file coverage.filtered.info
      - genhtml coverage.filtered.info --output-directory coverage-report
      - echo "Coverage report generated in coverage-report/index.html"

    silent: false

  clean:
    desc: "Cleaning existing build and binaries"
    cmds:
      - rm -rf ./build
      - rm -rf ./Release
