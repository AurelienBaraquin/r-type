version: '3'

tasks:
  i:
    desc: "Install Conan dependencies and configure build system"
    cmds:
      - task install

  install:
    desc: "Install Conan dependencies and configure build system"
    cmds:
      - conan install . --output-folder=build --build=missing -s compiler.cppstd=17

  b:
    desc: "Build the project with conan-release preset"
    cmds:
      - task build

  build:
    desc: "Build the project with conan-release preset"
    cmds:
      - cmake --preset conan-release -DBUILD_RTYPE=ON -DBUILD_TESTS=OFF -DBUILD_TOOLS=ON -DGRAPHIC=ON -DPHYSICS=ON -DINPUTS=ON -DAUDIO=ON
      - cmake --build build --preset conan-release
      - mkdir -p Release
      - cp ./build/build/Release/Engine/Tools/DocGen/DocGen ./Release/DocGen
      - cp ./build/build/Release/Games/RType/RType          ./Release/RType

  bw:
    desc: "Build the project with conan-debug preset"
    cmds:
      - task buildw

  buildw:
    desc: "Build the project with conan-default preset for windows"
    cmds:
      - cmake --preset conan-default -DBUILD_RTYPE=ON -DBUILD_TESTS=OFF -DGRAPHIC=ON -DPHYSICS=ON -DINPUTS=ON -DAUDIO=ON
      - cmake --build build --preset conan-release

  rtype:
    desc: "Run the RType target"
    cmds:
      - ./build/build/Release/Games/RType/RType

  test:
    desc: "Run the test target with coverage and generate HTML report"
    cmds:
      - cmake --preset conan-release -DBUILD_RTYPE=ON -DBUILD_TESTS=ON -DCOVERAGE=ON
      - cmake --build build --preset conan-release
      - ./build/build/Release/Engine/Test/Test
      - lcov --capture --directory ./build --output-file coverage.info
      - lcov --remove coverage.info '/usr/*' '*/build/_deps/*' --output-file coverage.filtered.info
      - genhtml coverage.filtered.info --output-directory coverage-report
      - echo "Coverage report generated in coverage-report/index.html"

    silent: false
