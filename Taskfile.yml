version: "3"

tasks:
  i:
    desc: "Install Conan dependencies and configure build system"
    cmds:
      - task install

  install:
    desc: "Install Conan dependencies and configure build system"
    cmds:
      - conan install . --output-folder=build --build=missing -s compiler.cppstd=17

  b:
    desc: "Build r-type client and server with conan-release preset"
    cmds:
      - task build

  cb:
    desc: "Build rtype client with conan-release preset"
    cmds:
      - cmake --preset conan-release -DBUILD_RTYPE=ON -DBUILD_PONG=ON -DBUILD_TESTS=OFF -DBUILD_TOOLS=OFF -DGRAPHIC=ON -DPHYSICS=ON -DINPUTS=ON -DAUDIO=ON -DNETWORK=ON -DSERVER=OFF -DCLIENT=ON
      - cmake --build build --preset conan-release
      - mkdir -p ./Release
      - cp ./build/build/Release/Games/RType/r-type_client ./Release/r-type_client
      - cp ./build/build/Release/Games/Pong/pong_client ./Release/pong_client

  enginebuild:
    desc: "Build the engine with conan-release preset"
    cmds:
      - cmake --preset conan-release -DBUILD_ENGINE_EDITOR=ON -DBUILD_TESTS=OFF -DBUILD_TOOLS=OFF -DGRAPHIC=ON -DPHYSICS=ON -DINPUTS=ON -DAUDIO=ON -DNETWORK=ON -DSERVER=OFF -DCLIENT=ON
      - cmake --build build --preset conan-release
      - mkdir -p ./Release
      - cp ./build/build/Release/Games/EngineEditor/EngineEditor ./Release/EngineEditor
  ee:
    desc: "Run the engine editor"
    cmds:
      - ./Release/EngineEditor
  sb:
    desc: "Build rtype server with conan-release preset"
    cmds:
      - cmake --preset conan-release -DBUILD_RTYPE=ON -DBUILD_PONG=ON -DBUILD_TESTS=OFF -DBUILD_TOOLS=OFF -DGRAPHIC=OFF -DPHYSICS=ON -DINPUTS=ON -DAUDIO=ON -DNETWORK=ON -DSERVER=ON -DCLIENT=OFF
      - cmake --build build --preset conan-release
      - mkdir -p ./Release
      - cp ./build/build/Release/Games/RType/r-type_server ./Release/r-type_server
      - cp ./build/build/Release/Games/Pong/pong_server ./Release/pong_server

  build:
    desc: "Build r-type client and server conan-release preset"
    cmds:
      - task cb
      - task sb

  bw:
    desc: "Build the project with conan-debug preset"
    cmds:
      - task buildw

  buildw:
    desc: "Build the r-type client and server with conan-default preset for windows"
    cmds:
      - cmake --preset conan-release -DBUILD_RTYPE=ON -DBUILD_PONG=ON -DBUILD_TESTS=OFF -DGRAPHIC=ON -DPHYSICS=ON -DINPUTS=ON -DAUDIO=ON -DSERVER=ON -DCLIENT=OFF
      - cmake --preset conan-release -DBUILD_RTYPE=ON -DBUILD_PONG=ON -DBUILD_TESTS=OFF -DGRAPHIC=ON -DPHYSICS=ON -DINPUTS=ON -DAUDIO=ON -DSERVER=OFF -DCLIENT=ON
      - cmake --build build --preset conan-release

  crtype:
    desc: "Run the r-type client target"
    cmds:
      - ./build/build/Release/Games/RType/r-type_client

  cpong:
    desc: "Run the r-type client target"
    cmds:
      - ./build/build/Release/Games/Pong/pong_client

  srtype:
    desc: "Run the r-type server target"
    cmds:
      - ./build/build/Release/Games/RType/r-type_server

  cdebugMac:
    desc: "Run the RType client target in debug mode on Mac"
    cmds:
      - lldb ./build/build/Release/Games/RType/r-type_client

  eedebugMac:
    desc: "Run the EngineEditor target in debug mode on Mac"
    cmds:
      - lldb ./build/build/Release/Games/EngineEditor/EngineEditor

  sdebugMac:
    desc: "Run the RType server target in debug mode on Mac"
    cmds:
      - lldb ./build/build/Release/Games/RType/r-type_server

  test:
    desc: "Run the test target with coverage and generate HTML report"
    cmds:
      - cmake --preset conan-release -DBUILD_RTYPE=ON -DBUILD_TESTS=ON -DCOVERAGE=ON
      - cmake --build build --preset conan-release
      - ./build/build/Release/Engine/Test/Test
      - lcov --capture --directory ./build --output-file coverage.info
      - lcov --remove coverage.info '/usr/*' '*/build/_deps/*' --output-file coverage.filtered.info
      - genhtml coverage.filtered.info --output-directory coverage-report
      - echo "Coverage report generated in coverage-report/index.html"

    silent: false

  cb_tsan:
    desc: "Build rtype client with ThreadSanitizer"
    cmds:
      - cmake --preset conan-release -DBUILD_RTYPE=ON -DBUILD_TESTS=OFF -DBUILD_TOOLS=OFF -DGRAPHIC=ON -DPHYSICS=ON -DINPUTS=ON -DAUDIO=ON -DSERVER=OFF -DCLIENT=ON -DCMAKE_CXX_FLAGS="-fsanitize=thread -g -O1"
      - cmake --build build --preset conan-release
      - mkdir -p ./Release_TSan
      - cp ./build/build/Release/Games/RType/r-type_client ./Release_TSan/r-type_client_tsan

  crtype_tsan:
    desc: "Run the r-type client with ThreadSanitizer"
    cmds:
      - >
        TSAN_OPTIONS="history_size=7 verbosity=1 log_path=tsan_output.log" ./Release_TSan/r-type_client_tsan 2>tsan_error.log

  crtype_tsan_loop:
    desc: "Run the r-type client with ThreadSanitizer in loop until crash"
    cmds:
      - >
        while true; do
          echo "Starting new run at $(date)" >> crash_log.txt;
          TSAN_OPTIONS="history_size=7 verbosity=1 log_path=tsan_output.log" ./Release_TSan/r-type_client_tsan 2>>tsan_error.log;
          if [ $? -ne 0 ]; then
            echo "Crash detected at $(date)" >> crash_log.txt;
            break;
          fi;
        done

  clean:
    desc: "Cleaning existing build and binaries"
    cmds:
      - rm -rf ./build
      - rm -rf ./Release
